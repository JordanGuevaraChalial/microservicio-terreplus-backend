events {
    worker_connections 1024;
}

http {
    upstream auth {
        server ms-auth:3001;
    }
    upstream lands {
        server ms-lands:3002;
    }
    upstream valuation {
        server ms-valuation:8000;
    }

    server {
        listen 80;

        # Auth routes
        location /api/auth/ {
            proxy_pass http://auth/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # User routes (ahora van a ms-auth)
        location /api/user/ {
            proxy_pass http://auth/api/user/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Terrain routes (ms-lands)
        location /api/terrain/ {
            proxy_pass http://lands/api/terrain/;
            proxy_set_header Host $host;
        }

        # Dashboard routes (ms-lands)
        location /api/dashboard/ {
            proxy_pass http://lands/api/dashboard/;
            proxy_set_header Host $host;
        }

        # Factor routes (ms-lands)
        location /api/factors/ {
            proxy_pass http://lands/api/factors/;
            proxy_set_header Host $host;
        }

        # ML routes (ms-valuation)
        location /api/ml/ {
            proxy_pass http://valuation/api/v1/;
            proxy_set_header Host $host;
        }

        # Health checks
        location /health {
            proxy_pass http://lands/health;
            proxy_set_header Host $host;
        }
    }
}